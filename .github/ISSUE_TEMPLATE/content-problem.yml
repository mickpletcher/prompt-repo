name: Content problem
description: Report incorrect, unclear, unsafe, or outdated repository content.
title: "[Content]: "
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        Do not disclose secrets or vulnerabilities here. Use the private process
        in SECURITY.md for sensitive reports.
  - type: input
    id: file
    attributes:
      label: Affected file
      placeholder: prompts/category/example.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is incorrect, unclear, unsafe, or outdated.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Recommended behavior or wording
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized output or links when helpful.
